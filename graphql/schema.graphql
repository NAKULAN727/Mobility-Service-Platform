# --- CUSTOM ENUMS ---

enum VehicleType {
  SEDAN
  SUV
  LUXURY
  VAN
  HATCHBACK
}

enum AvailabilityStatus {
  AVAILABLE
  BOOKED
  MAINTENANCE
  OUT_OF_SERVICE
  DECOMMISSIONED
}

enum ServiceType {
  DRIVER_ONLY
  CAR_WITH_DRIVER
}

enum DriverType {
  DRIVER_ONLY
  DRIVER_WITH_VEHICLE
}

enum BookingStatus {
  REQUESTED
  MATCHING
  DRIVER_ASSIGNED
  PENDING_DRIVER_ACCEPTANCE
  ACCEPTED
  DRIVER_ARRIVING
  OTP_PENDING
  OTP_VERIFIED
  TRIP_STARTED
  TRIP_COMPLETED
  REVIEW_PENDING
  CLOSED
  CANCELLED
  DISPUTED
  REJECTED
}

enum PaymentMethod {
  UPI
  CARD
  CASH
}

enum PaymentStatus {
  PENDING
  SUCCESS
  FAILED
}

enum ErrorCode {
  UNAUTHORIZED
  NOT_FOUND
  INVALID_INPUT
  VALIDATION_FAILED
  INSUFFICIENT_FUNDS
  VEHICLE_UNAVAILABLE
  DRIVER_REST_PERIOD
  STATE_TRANSITION_FORBIDDEN
  DUPLICATE_RESOURCE
}

enum Role {
  CUSTOMER
  DRIVER
  ADMIN
  FLEET_MANAGER
}

enum VerificationStatus {
  PENDING
  APPROVED
  REJECTED
}

enum DocumentType {
  DRIVING_LICENSE
  AADHAAR
  PAN_CARD
  VEHICLE_CERTIFICATE
}

enum NotificationType {
  INFO
  SUCCESS
  WARNING
  ERROR
  SYSTEM
}

enum ServiceCapability {
  DRIVER_ONLY
  CAR_WITH_DRIVER
  BOTH
}

# --- ERROR HANDLING STRATEGY TYPES ---

type UserError {
  field: [String!]!
  message: String!
  code: ErrorCode!
}

# --- ENTITY TYPES ---

type Vehicle {
  id: ID!
  registrationNumber: String!
  make: String!
  vehicleType: VehicleType!
  model: String!
  seatingCapacity: Int!
  insurance: String
  verificationStatus: VerificationStatus!
  availabilityStatus: AvailabilityStatus!
  createdAt: String!
  updatedAt: String!
}

type Location {
  id: ID!
  pickupLocation: String!
  destinationLocation: String!
  distance: Float!
  estimatedDuration: Int!
  createdAt: String!
  updatedAt: String!
}

type Booking {
  id: ID!
  customerId: ID!
  driverId: ID
  vehicleId: ID
  serviceType: ServiceType!
  location: Location!
  bookingDate: String! # ISO Date string (e.g. YYYY-MM-DD)
  bookingTime: String! # 24hr Time format (e.g. HH:MM)
  fareAmount: Float!
  bookingStatus: BookingStatus!
  otpCode: String!
  payment: Payment
  review: Review
  customer: User
  driver: User
  createdAt: String!
  updatedAt: String!
}

type Review {
  id: ID!
  bookingId: ID!
  rating: Int!
  reviewText: String!
  sentiment: String!
  confidence: Float!
  keywords: [String!]!
  summary: String!
  createdAt: String!
}

type Notification {
  id: ID!
  userId: ID!
  title: String!
  message: String!
  type: NotificationType!
  read: Boolean!
  createdAt: String!
}

type ReviewPayload {
  success: Boolean!
  errors: [UserError!]!
  review: Review
}

type Payment {
  id: ID!
  bookingId: ID!
  amount: Float!
  paymentMethod: PaymentMethod!
  paymentStatus: PaymentStatus!
  transactionId: String
  createdAt: String!
  updatedAt: String!
}

type User {
  id: ID!
  fullName: String!
  email: String!
  phone: String!
  role: Role!
  profileImage: String
  isVerified: Boolean!
  createdAt: String!
  updatedAt: String!
  driverProfile: DriverProfile
}

type DriverProfile {
  id: ID!
  userId: ID!
  licenseNumber: String!
  experienceYears: Int!
  driverType: DriverType!
  ownsVehicle: Boolean!
  vehicleId: ID
  availabilityStatus: Boolean!
  verificationStatus: VerificationStatus!
  createdAt: String!
  updatedAt: String!
  user: User!
  documents: [DriverDocument!]!
}

type DriverDocument {
  id: ID!
  driverId: ID!
  documentType: DocumentType!
  documentUrl: String!
  uploadedAt: String!
}

type AvailableDriverVehicle {
  id: ID!
  make: String!
  model: String!
  registrationNumber: String!
  vehicleType: VehicleType!
}

type AvailableDriver {
  id: ID!
  userId: ID!
  fullName: String!
  profileImage: String
  rating: Float!
  experienceYears: Int!
  serviceCapability: ServiceCapability!
  canDriveCustomerVehicle: Boolean!
  canProvideOwnVehicle: Boolean!
  vehicle: AvailableDriverVehicle
  distanceKm: Float!
  etaMinutes: Int!
  availabilityStatus: Boolean!
  priceEstimate: Float!
  locationHint: String
  createdAt: String!
}

type AuthResponse {
  token: String!
  user: User!
}

# --- RELAY CURSOR PAGINATION TYPES ---

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type BookingEdge {
  node: Booking!
  cursor: String!
}

type BookingConnection {
  edges: [BookingEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# --- INPUT TYPES ---

input BookingCreateInput {
  customerId: ID!
  serviceType: ServiceType!
  vehicleId: ID # Optional, selected if CAR_WITH_DRIVER
  pickupLocation: String!
  destinationLocation: String!
  distance: Float!
  estimatedDuration: Int!
  bookingDate: String!
  bookingTime: String!
  fareAmount: Float!
}

input ManualBookingCreateInput {
  customerId: ID!
  driverId: ID!
  serviceType: ServiceType!
  pickupLocation: String!
  destinationLocation: String!
  distance: Float!
  estimatedDuration: Int!
  bookingDate: String!
  bookingTime: String!
  fareAmount: Float!
}

input VehicleCreateInput {
  registrationNumber: String!
  make: String!
  vehicleType: VehicleType!
  model: String!
  seatingCapacity: Int!
  availabilityStatus: AvailabilityStatus
}

input VehicleUpdateInput {
  registrationNumber: String
  make: String
  vehicleType: VehicleType
  model: String
  seatingCapacity: Int
  availabilityStatus: AvailabilityStatus
}

input PaymentCreateInput {
  bookingId: ID!
  amount: Float!
  paymentMethod: PaymentMethod!
}

# --- MUTATION RESPONSE PAYLOADS ---

type BookingPayload {
  success: Boolean!
  errors: [UserError!]!
  booking: Booking
}

type VehiclePayload {
  success: Boolean!
  errors: [UserError!]!
  vehicle: Vehicle
}

type PaymentPayload {
  success: Boolean!
  errors: [UserError!]!
  payment: Payment
}

type Query {
  # Retrieve available vehicles for hiring based on type filter and seating requirements
  getAvailableVehicles(
    type: VehicleType
    minCapacity: Int
    limit: Int = 10
    offset: Int = 0
  ): [Vehicle!]!

  # Retrieve single vehicle by ID
  getVehicleById(id: ID!): Vehicle

  # Retrieve single booking by ID
  getBookingById(id: ID!): Booking

  # Retrieve paginated history of bookings for a specific customer or driver (Relay Spec)
  getBookingHistory(
    customerId: ID!
    first: Int
    after: String
    last: Int
    before: String
  ): BookingConnection!

  # Admin portal retrieval of all bookings
  getAllBookings(limit: Int = 20, offset: Int = 0): [Booking!]!

  # Retrieve payment details linked with a specific booking
  getPaymentDetails(bookingId: ID!): Payment

  # AI-facing: estimate fare before booking
  estimateFare(
    distanceKm: Float!
    vehicleType: VehicleType!
    serviceType: ServiceType!
  ): FareEstimate!

  # AI-facing: get all active bookings (for AI dispatch)
  getActiveBookings: [Booking!]!

  # Manual booking: browse eligible drivers
  getAvailableDrivers(
    serviceType: ServiceType!
    pickupLocation: String
    destinationLocation: String
    distanceKm: Float
    estimatedDurationMin: Int
  ): [AvailableDriver!]!

  # Member 1 Auth Queries
  me: User
  getUserProfile(userId: ID!): User
  getAllDrivers: [DriverProfile!]!
  getDriverById(driverId: ID!): DriverProfile

  # Notifications
  getNotifications: [Notification!]!
}

type Mutation {
  # Customer Booking Creation
  createBooking(input: BookingCreateInput!): BookingPayload!

  # Manual booking: request a specific driver
  createManualBooking(input: ManualBookingCreateInput!): BookingPayload!

  # Cancel booking before or during dispatch transition
  cancelBooking(bookingId: ID!, reason: String): BookingPayload!

  # Driver accepts offered booking request
  acceptBooking(bookingId: ID!, driverId: ID!): BookingPayload!

  # Driver rejects offered booking request
  rejectBooking(bookingId: ID!, driverId: ID!): BookingPayload!

  # Driver indicates they are on the way
  driverArriving(bookingId: ID!): BookingPayload!

  # Driver indicates they have arrived at pickup, requests OTP
  arriveAtPickup(bookingId: ID!): BookingPayload!

  # Driver inputs OTP from customer
  verifyOTP(bookingId: ID!, otpCode: String!): BookingPayload!

  # Driver begins active ride route
  startTrip(bookingId: ID!): BookingPayload!

  # Driver marks destination as reached and completes the ride
  completeTrip(bookingId: ID!): BookingPayload!

  # Payment Authorization Hold trigger for booking
  createPayment(input: PaymentCreateInput!): PaymentPayload!

  # Administrative Fleet Management Actions
  addVehicle(input: VehicleCreateInput!): VehiclePayload!
  updateVehicle(id: ID!, input: VehicleUpdateInput!): VehiclePayload!
  deleteVehicle(id: ID!): VehiclePayload!

  # Update the payment status of an existing transaction
  updatePaymentStatus(paymentId: ID!, status: PaymentStatus!): PaymentPayload!

  # Member 1 Auth Mutations
  registerCustomer(
    fullName: String!
    email: String!
    phone: String!
    password: String!
  ): AuthResponse!

  registerDriver(
    fullName: String!
    email: String!
    phone: String!
    password: String!
    licenseNumber: String!
    experienceYears: Int!
    driverType: DriverType!
    ownsVehicle: Boolean!
    vehicleId: ID
    # Vehicle fields — required when ownsVehicle is true
    vehicleType: VehicleType
    vehicleMake: String
    vehicleModel: String
    vehicleRegistrationNumber: String
    vehicleSeatingCapacity: Int
  ): AuthResponse!

  login(
    email: String!
    password: String!
  ): AuthResponse!

  updateProfile(
    fullName: String
    phone: String
    profileImage: String
  ): User!

  uploadDriverDocument(
    documentType: DocumentType!
    documentUrl: String!
  ): DriverDocument!

  verifyDriver(driverId: ID!): DriverProfile!
  rejectDriver(driverId: ID!): DriverProfile!
  changePassword(oldPassword: String!, newPassword: String!): Boolean!
  toggleDriverAvailability: DriverProfile!
  
  submitReview(
    bookingId: ID!
    rating: Int!
    reviewText: String!
  ): ReviewPayload!

  # Notifications
  markNotificationRead(id: ID!): Boolean!
  markAllNotificationsRead: Boolean!
}

type FareEstimate {
  baseFare: Float!
  distanceFare: Float!
  serviceFee: Float!
  totalFare: Float!
  ratePerKm: Float!
  distanceKm: Float!
  estimatedDurationMin: Int!
  vehicleType: String!
  serviceType: String!
}
